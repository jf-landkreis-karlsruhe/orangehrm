name: PHP Version Test

# Split out of scheduled_test.yml: the PHP matrix runs on PRs as well,
# the long-running DB matrix (db_test) only on main.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  php_test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]

    services:
      mysql:
        image: "mariadb:10.0"
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
          --tmpfs /var/lib/mysql/

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          php -v
          composer -v
          php -f /usr/bin/composer install -d src
          php -f /usr/bin/composer install -d devTools/core

      - name: Install OrangeHRM
        run: |
          php installer/cli_install.php
          mysqldump -V
          php devTools/core/console.php i:create-test-db -p root --dump-options="--column-statistics=0"

      - name: Configure LDAP server
        run: |
          cd src/plugins/orangehrmLDAPAuthenticationPlugin/test/config
          docker run --detach --rm --name openldap \
            --network ${{ job.container.network }} \
            -p 389:1389 \
            -e LDAP_ADMIN_USERNAME=admin \
            -e LDAP_ADMIN_PASSWORD=admin \
            -e LDAP_ROOT=dc=example,dc=org \
            -e LDAP_CONFIG_ADMIN_ENABLED=yes \
            -e LDAP_CONFIG_ADMIN_USERNAME=admin \
            -e LDAP_CONFIG_ADMIN_PASSWORD=admin \
            -e LDAP_SKIP_DEFAULT_TREE=yes \
            -v $PWD/ldifs:/ldifs \
            bitnamilegacy/openldap:2.6.4
          cat server-config.tpl.yaml > server-config.yaml

      - name: Run test
        run: |
          php ./src/vendor/bin/phpunit

      - name: Stop LDAP container
        if: ${{ always() }}
        run: docker stop openldap
