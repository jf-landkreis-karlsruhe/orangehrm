name: Docker Publish to GHCR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract OrangeHRM version from git tag
        id: version
        run: |
          # Extract version from tag (e.g., v5.8.0 -> 5.8.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "ohrm_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building OrangeHRM version: ${VERSION}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OHRM_VERSION=${{ steps.version.outputs.ohrm_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image information
        run: |
          echo "Image has been published to GitHub Container Registry"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Pull the image with:"
          echo "  docker pull ghcr.io/${{ github.repository }}:latest"
          echo "  docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.ohrm_version }}"
