name: Cypress

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Runs the functional suite against the fork's docker/local stack
# (app image built from this checkout + MariaDB).
env:
  COMPOSE: docker compose -f docker/local/docker-compose.yml -f docker/local/docker-compose.cypress.yml
  ORANGEHRM_ADMIN_PASSWORD: Jacqueline@OHRM123

jobs:
  cypress:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t orangehrm-local-base:latest -f docker/local/Dockerfile.base .
          $COMPOSE build app

      - name: Start app
        run: $COMPOSE up -d

      - name: Wait for OrangeHRM
        run: |
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/web/index.php/auth/login || true)"
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$($COMPOSE ps -q app | xargs docker inspect -f '{{.State.Running}}')" != "true" ]; then
              echo "::error::App container stopped."
              exit 1
            fi
            sleep 2
          done
          echo "::error::OrangeHRM did not come up (last HTTP: ${code:-none})."
          exit 1

      - name: Prepare functional testing
        run: $COMPOSE exec -T app php src/test/functional/tools/prepare.php

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        env:
          CYPRESS_BASE_URL: http://localhost:8080/web/index.php
          CYPRESS_VIDEO: true
          CYPRESS_DEFAULT_COMMAND_TIMEOUT: 10000
        run: |
          corepack enable
          cd src/test/functional
          yarn install
          yarn test

      - name: Collect logs
        if: ${{ always() }}
        run: |
          mkdir -p ci-logs
          $COMPOSE logs --no-color > ci-logs/docker-compose.log 2>&1 || true
          $COMPOSE cp app:/var/www/html/src/log ci-logs/src-log || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: videos-${{ github.sha }}
          path: |
            src/test/functional/cypress/videos
            src/test/functional/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: logs-${{ github.sha }}
          path: ci-logs
          if-no-files-found: ignore

      - name: Tear down
        if: ${{ always() }}
        run: $COMPOSE down -v
