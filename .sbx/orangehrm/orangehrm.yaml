# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: OrangeHRM Claude Code
description: Claude Code with PHP 8.3, Composer, Node 20, Yarn 4 and MariaDB for this repo

# Hosts the Makefile workflow needs at runtime (composer/yarn install,
# make local-build). Kit rules apply under every sbx policy preset
# (incl. Locked Down); deny rules still win.
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # git / GitHub (also hosts Composer dist zips)
          - github.com:443
          - api.github.com:443
          - codeload.github.com:443
          - objects.githubusercontent.com:443
          # Composer
          - packagist.org:443
          - repo.packagist.org:443
          # Yarn / npm
          - registry.yarnpkg.com:443
          - repo.yarnpkg.com:443
          - registry.npmjs.org:443
          # Docker Hub: php, node, mariadb, composer images
          - registry-1.docker.io:443
          - auth.docker.io:443
          - production.cloudflare.docker.com:443
          # apt, PECL and NodeSource in docker/dev and docker/local Dockerfiles
          - deb.debian.org:80
          - deb.debian.org:443
          - security.debian.org:80
          - security.debian.org:443
          - pecl.php.net:443
          - deb.nodesource.com:443
